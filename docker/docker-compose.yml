services:
  aquarium:
    image: ghcr.io/drganmon/aquarium-logbuch:${AQUARIUM_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Gemeinsamer Schlüssel für KI-Schlüssel und Backup-Geheimnisse (64 Hex-Zeichen).
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-}"
      # Datenbank-Umschaltung: 'mongodb' oder 'sqlite'
      DB_TYPE: "mongodb"
      MONGODB_URI: "mongodb://root:aquarium_secret_password@mongo:27017/aquarium?authSource=admin&replicaSet=rs0"
      MONGODB_DB_NAME: "aquarium"
      
      # Öffentliche Adresse der App (bei https:// werden Cookies automatisch als Secure gesetzt)
      APP_URL: "http://localhost:3000"
      
      # E-Mail-Adresse des Administrators (für Admin-Bereich & Benutzerverwaltung)
      ADMIN_EMAIL: "admin@example.com"
      
      # Registrierung und lokale Anmeldung
      ALLOW_REGISTRATION: "true"
      LOCAL_LOGIN: "true"
      
      # Überwachungsprozess (Watchdog / Neustart bei Fehlern)
      SUPERVISOR: "true"
      LOG_FILE: "/data/aquarium.log"

      # Multithreading & Multi-Core Workers (auto = nutzt alle CPU-Kerne)
      WORKERS: "auto"
      WORKER_THREADS: "auto"

      # OIDC / Pocket ID (optional aktivieren)
      # OIDC_ISSUER: "https://id.example.com"
      # OIDC_CLIENT_ID: "aquarium-app"
      # OIDC_CLIENT_SECRET: ""
      
      # Auf "1" setzen, wenn ein Reverse Proxy davorsteht
      # TRUST_PROXY: "1"
    volumes:
      - aquarium-data:/data

  mongo:
    image: mongo:7
    restart: unless-stopped
    entrypoint: ["bash", "-c", "head -c 756 /dev/urandom | base64 > /tmp/mongo-keyfile && chmod 400 /tmp/mongo-keyfile && chown 999:999 /tmp/mongo-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: aquarium_secret_password
      MONGO_INITDB_DATABASE: aquarium
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) }' >/dev/null 2>&1 && mongosh --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval 'rs.status().ok' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  aquarium-data:
  mongo-data:

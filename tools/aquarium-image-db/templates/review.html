<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilddatenbank – Review</title>
<style>
  :root {
    --ink: #10343c;
    --water: #e6eeed;
    --tile: #ffffff;
    --muted: #5b7378;
    --ok: #2e7d5b;
    --manual: #3b5ba9;
    --review: #b7801a;
    --missing: #a63d2f;
    font-family: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: var(--water);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--ink); color: #fff;
    padding: 0.9rem 1.25rem;
    display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center;
  }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 auto 0 0; letter-spacing: 0.01em; }
  .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .filters button {
    font: inherit; font-size: 0.85rem; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #fff;
    border-radius: 999px; padding: 0.3rem 0.8rem;
  }
  .filters button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .filters button .dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; margin-right: 0.4em; }
  input, select {
    font: inherit; font-size: 0.9rem; padding: 0.35rem 0.6rem;
    border-radius: 6px; border: 0; min-width: 12rem;
  }
  :focus-visible { outline: 3px solid #7fc4c9; outline-offset: 2px; }
  main {
    display: grid; gap: 1rem; padding: 1.25rem;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  figure {
    margin: 0; background: var(--tile); border-radius: 8px; overflow: hidden;
    border-top: 5px solid var(--status, var(--muted));
    display: flex; flex-direction: column;
  }
  .img { aspect-ratio: 4 / 3; background: #d5e1df; display: block; }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .empty { display: grid; place-items: center; height: 100%; padding: 1rem; text-align: center; color: var(--missing); font-size: 0.9rem; }
  figcaption { padding: 0.65rem 0.8rem 0.8rem; font-size: 0.85rem; line-height: 1.4; }
  .name { font-weight: 600; font-size: 0.95rem; }
  .sci { font-style: italic; color: var(--muted); }
  .meta { margin-top: 0.4rem; color: var(--muted); font-size: 0.78rem; }
  .status { font-weight: 600; color: var(--status); }
  .meta a { color: var(--ink); }
  .credit { color: var(--ink); margin: 0.3rem 0; }
  .tier { display: inline-block; font-weight: 600; font-size: 0.75rem; padding: 0.05rem 0.45rem; border-radius: 4px; margin-bottom: 0.15rem; }
  .tier-public-domain { background: #d7eadf; color: #1f5a40; }
  .tier-cc-by { background: #dde6f5; color: #2c4783; }
  .tier-cc-by-sa { background: #f3e7cf; color: #6e4f12; }
  .why { color: var(--review); margin-top: 0.3rem; }
  .controls[hidden] { display: none; }
  figure[hidden] { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.55rem; }
  .actions button, .dlg-head button, .cand button {
    font: inherit; font-size: 0.8rem; cursor: pointer;
    border: 1px solid var(--ink); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 0.3rem 0.6rem;
  }
  .actions button.primary, .cand button.primary { background: var(--ink); color: #fff; }
  button[disabled] { opacity: 0.55; cursor: progress; }
  dialog { width: min(1180px, 96vw); max-height: 92vh; border: 0; border-radius: 10px; padding: 0; color: var(--ink); }
  dialog::backdrop { background: rgba(16, 52, 60, 0.6); }
  .dlg-head { position: sticky; top: 0; z-index: 1; background: var(--ink); color: #fff; padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .dlg-head h2 { font-size: 1rem; font-weight: 600; margin: 0 auto 0 0; }
  .dlg-head form { display: flex; gap: 0.4rem; flex: 1 1 20rem; max-width: 32rem; }
  .dlg-head input { flex: 1; min-width: 0; }
  .dlg-head button { background: transparent; color: #fff; border-color: rgba(255,255,255,0.5); }
  .dlg-body { padding: 1rem; background: var(--water); }
  .dlg-body > p { margin: 0 0 0.8rem; font-size: 0.88rem; }
  .cands { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .cand { background: #fff; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; font-size: 0.8rem; line-height: 1.4; }
  .cand.current { outline: 3px solid var(--ok); }
  .cand.excluded { opacity: 0.6; }
  .cand .body { padding: 0.55rem 0.65rem 0.7rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; flex: 1; }
  .cand .body button { margin-top: auto; align-self: flex-start; }
  .cand .title { font-weight: 600; word-break: break-word; }
  .cand .muted { color: var(--muted); }
  .flag { font-weight: 600; color: var(--ok); }
  .flag.excl { color: var(--missing); }
  .rejected { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); }
  .rejected li { word-break: break-word; }
  .busy { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }
  details { margin-top: 0.35rem; font-size: 0.75rem; color: var(--muted); }
  .count { color: var(--muted); padding: 0 1.25rem; margin-top: 1rem; }
  @media (max-width: 600px) { header { position: static; } input, select { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Bilder prüfen</h1>
  <div class="controls filters" role="group" aria-label="Nach Status filtern" hidden>{{FILTERS}}</div>
  <select class="controls" id="kind" aria-label="Tiere oder Pflanzen" hidden><option value="">Tiere und Pflanzen</option><option value="animal">Nur Tiere</option><option value="plant">Nur Pflanzen</option></select>
  <select class="controls" id="collection" aria-label="Sammlung" hidden><option value="">Alle Sammlungen</option>{{COLLECTIONS}}</select>
  <select class="controls" id="tier" aria-label="Lizenz" hidden><option value="">Alle Lizenzen</option><option value="public-domain">Gemeinfrei / CC0</option><option value="cc-by">CC BY</option><option value="cc-by-sa">CC BY-SA</option></select>
  <input class="controls" id="q" type="search" placeholder="Name oder ID suchen" aria-label="Suchen" hidden>
</header>
<p class="count" id="count">{{TOTAL}} Einträge ({{MODE}}), erzeugt {{GENERATED}}</p>
<main id="grid">
{{CARDS}}
</main>
<script>
// Filter. Die Karten stehen bereits im HTML und sind auch ohne JavaScript sichtbar.
(function () {
  const active = new Set(["ok", "manual", "review", "missing"]);
  document.querySelectorAll(".controls").forEach(el => el.hidden = false);
  const q = document.getElementById("q"), col = document.getElementById("collection"), tier = document.getElementById("tier"), kind = document.getElementById("kind");
  function apply() {
    const cards = document.querySelectorAll("figure[data-status]");
    const text = q.value.toLowerCase();
    let shown = 0;
    for (const c of cards) {
      const visible = active.has(c.dataset.status)
        && (!col.value || c.dataset.collections.split(" ").includes(col.value))
        && (!tier.value || c.dataset.tier === tier.value)
        && (!kind.value || c.dataset.kind === kind.value)
        && (!text || c.dataset.search.includes(text));
      c.hidden = !visible;
      if (visible) shown++;
    }
    document.getElementById("count").textContent = shown + " von " + cards.length + " Einträgen ({{MODE}})";
  }
  window.applyFilters = apply;
  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    const s = b.dataset.status;
    active.has(s) ? active.delete(s) : active.add(s);
    b.setAttribute("aria-pressed", active.has(s));
    apply();
  }));
  q.addEventListener("input", apply);
  col.addEventListener("change", apply);
  tier.addEventListener("change", apply);
  kind.addEventListener("change", apply);
  apply();
})();
</script>
{{SERVER}}
</body>
</html>

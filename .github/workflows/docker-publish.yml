name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate revision and patch from commits
        id: version
        run: node scripts/version.js --github-output
      - name: Check explicit release tag
        if: github.ref_type == 'tag'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "Release tag must match v$APP_VERSION"
            exit 1
          fi

  runtime-check:
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      AQUARIUM_TEST_JOBS: '2'
      MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/aquarium-mongodb-binaries
      MONGOMS_USE_ARCHIVE_NAME_FOR_BINARY_NAME: 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.3'
      - name: Cache MongoDB test binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'bun.lock') }}
          restore-keys: |
            mongodb-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            npm ci
          fi
      - name: Build and test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun run dist:bun
            AQUARIUM_TEST_BACKEND_BUILT="$PWD/dist/backend" bun run test:bun
          else
            npm run dist
            AQUARIUM_TEST_BACKEND_BUILT="$PWD/dist/backend" npm test
          fi

  build-and-push:
    needs: [version, runtime-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ needs.version.outputs.version }},priority=1000,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref_type == 'tag' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

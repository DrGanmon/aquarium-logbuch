<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12343b" id="meta-theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aquarium">
  <meta name="application-name" content="Aquarium-Logbuch">
  <title>Aquarium-Logbuch</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('aquarium_theme') || localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/">
      <img src="favicon-32x32.png" alt="Logo" class="brand-logo" width="24" height="24">
      <span>Aquarium-Logbuch</span>
    </a>
    <div class="topbar-right">
      <a class="btn small ghost" id="btn-species" href="#/species">Artenkatalog</a>
      <a class="btn small ghost topbar-user" id="btn-profile" href="#/profile" title="Mein Profil">
        <img id="topbar-avatar" class="avatar-small" style="display:none" alt="Avatar">
        <span id="whoami"></span>
      </a>
      <a class="btn small ghost" id="btn-admin" href="#/admin" hidden>Benutzerverwaltung</a>
      <button class="btn small ghost" id="btn-theme-topbar" type="button" title="Farbschema wechseln" aria-label="Farbschema wechseln">
        <span id="topbar-theme-icon">🌓</span>
      </button>
      <button class="btn small ghost" id="btn-logout" type="button">Abmelden</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="vendor/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
